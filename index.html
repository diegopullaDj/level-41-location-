<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090a0b">

<title>Classified Location</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#090a0b;
    overflow:hidden;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Courier New",monospace;
}

.screen{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(100vh,177.78vw);
    max-width:572px;
    max-height:1017px;
    aspect-ratio:572/1017;
    background:url("fondo.png") center/cover no-repeat;
    overflow:hidden;
}

.access{
    position:absolute;
    left:50%;
    top:67%;
    transform:translate(-50%,-50%);
    width:72%;
    text-align:center;
    z-index:10;
}

.label{
    color:#d9d9d9;
    font-size:clamp(10px,2.2vw,15px);
    letter-spacing:2px;
    margin-bottom:14px;
    text-shadow:0 1px 4px #000;
}

.btn{
    position:relative;
    z-index:20;
    width:100%;
    min-height:58px;
    border:1px solid rgba(255,70,70,.9);
    background:linear-gradient(#8e1111,#510707);
    color:#fff;
    font-family:inherit;
    font-weight:bold;
    letter-spacing:2px;
    font-size:clamp(15px,4vw,22px);
    cursor:pointer;
    pointer-events:auto;
    touch-action:manipulation;
    box-shadow:
        0 0 22px rgba(210,0,0,.35),
        inset 0 0 18px rgba(255,80,80,.12);
    animation:pulse 2s infinite;
}

.btn:before{
    content:"";
    position:absolute;
    inset:-5px;
    border:1px solid rgba(255,30,30,.25);
    animation:ring 2s infinite;
    pointer-events:none;
}

.btn:disabled{
    cursor:wait;
}

@keyframes pulse{
    0%,100%{
        box-shadow:
            0 0 14px rgba(210,0,0,.25),
            inset 0 0 18px rgba(255,80,80,.1);
    }

    50%{
        box-shadow:
            0 0 32px rgba(230,0,0,.55),
            inset 0 0 24px rgba(255,80,80,.18);
    }
}

@keyframes ring{
    0%,100%{
        opacity:0;
        transform:scale(.98);
    }

    50%{
        opacity:1;
        transform:scale(1.02);
    }
}

.status{
    margin-top:14px;
    min-height:22px;
    color:#bcbcbc;
    font-size:clamp(9px,2vw,13px);
    letter-spacing:1.5px;
}

.scan{
    position:absolute;
    left:0;
    width:100%;
    height:2px;
    background:rgba(255,35,35,.65);
    box-shadow:0 0 12px rgba(255,0,0,.8);
    top:-5%;
    opacity:0;
    pointer-events:none;
    z-index:1;
}

.screen.active .scan{
    animation:scan 1.1s ease-out;
}

@keyframes scan{
    0%{
        top:15%;
        opacity:0;
    }

    15%,85%{
        opacity:1;
    }

    100%{
        top:85%;
        opacity:0;
    }
}

.screen.granted .access{
    animation:fadeOut .45s forwards;
}

.grantedMsg{
    position:absolute;
    left:50%;
    top:67%;
    transform:translate(-50%,-50%);
    width:90%;
    text-align:center;
    opacity:0;
    color:#f2f2f2;
    letter-spacing:2px;
    text-shadow:0 0 15px rgba(255,0,0,.5);
    z-index:5;
}

.grantedMsg .small{
    font-size:clamp(10px,2.3vw,14px);
    color:#aaa;
    margin-bottom:10px;
}

.grantedMsg .big{
    font-size:clamp(18px,5vw,28px);
    font-weight:bold;
    color:#fff;
}

.screen.granted .grantedMsg{
    animation:showMsg .6s .35s forwards;
}

@keyframes fadeOut{
    to{
        opacity:0;
        transform:translate(-50%,-55%);
    }
}

@keyframes showMsg{
    from{
        opacity:0;
        transform:translate(-50%,-45%);
    }

    to{
        opacity:1;
        transform:translate(-50%,-50%);
    }
}
</style>

</head>

<body>

<div class="screen" id="screen">

```
<div class="scan"></div>

<div class="access">

    <div class="label">
        SECURE LOCATION ACCESS
    </div>

    <button
        class="btn"
        id="btn"
        type="button"
        onclick="accessLocation()">
        ACCESS LOCATION
    </button>

    <div class="status" id="status"></div>

</div>

<div class="grantedMsg">

    <div class="small">
        SECURITY CLEARANCE
    </div>

    <div class="big">
        ACCESS GRANTED
    </div>

    <div class="small" style="margin-top:10px">
        OPENING LOCATION...
    </div>

</div>
```

</div>

<script>

function accessLocation(){

    const maps =
    "https://www.google.com/maps/dir/?api=1&destination=-2.9244800,-79.0437770";

    const screen = document.getElementById("screen");
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");

    if(!screen || !btn || !status){
        return;
    }

    btn.disabled = true;

    status.textContent = "AUTHENTICATING...";

    screen.classList.add("active");

    setTimeout(function(){

        status.textContent = "ACCESS GRANTED";

        screen.classList.add("granted");

    },850);

    setTimeout(function(){

        window.location.href = maps;

    },1450);

}

</script>

</body>
</html>
